[package]
name = "steal_stickers_bot"
version = "1.3.0"
edition = "2024"

[dependencies]
# telers = { version = "1.0.0-beta.9", features = [
#     "std",
#     "memory-storage",
#     "default_signal",
# ] }
telers = { git = "https://github.com/Desiders/telers.git", rev = "0955f1f", features = [
    "memory-storage",
    "default_signal",
] }
tokio = { version = "1.52", features = ["macros"] }
sea-query = "0.31"
sea-query-binder = { version = "0.6.0", features = ["sqlx-postgres"] }
sqlx = { version = "0.7", features = ["postgres", "time", "runtime-tokio"] }
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
random-string = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
thiserror = "2.0"
clap = { version = "4.5.16", features = ["derive"] }
chrono = "0.4"
# grammers-client = "0.10.0"
# grammers-session = "0.10.0"
grammers-client = { git = "https://codeberg.org/Lonami/grammers.git", rev = "58fe6e4357dbd8b9474a73f8fcd4e4e53875e1ce" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers.git", rev = "58fe6e4357dbd8b9474a73f8fcd4e4e53875e1ce" }
