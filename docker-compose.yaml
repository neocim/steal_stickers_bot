services:
  bot:
    container_name: steal_stickers.bot
    image: nnenty/steal_stickers_bot:latest
    build:
      context: .
    restart: on-failure:3
    networks:
      - steal_stickers.postgres.network
    logging:
      options:
        max-size: "100m"
    volumes:
      - "./configs:/app/configs:rw,z"
    command: start
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    container_name: steal_stickers.migrate
    image: nnenty/steal_stickers_bot:latest
    build:
      context: .
    command: migrate
    networks:
      - steal_stickers.postgres.network
    volumes:
      - "./configs:/app/configs:rw,z"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      options:
        max-size: "50m"

  postgres:
    container_name: steal_stickers.postgres
    image: "postgres:17-alpine"
    restart: "unless-stopped"
    env_file:
      - ./.env
    networks:
      - steal_stickers.postgres.network
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - steal_stickers.postgres.data:/var/lib/postgresql/data/:rw
    logging:
      options:
        max-size: "50m"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 60s
      retries: 10
      start_period: 3s

volumes:
  steal_stickers.postgres.data: {}

networks:
  steal_stickers.postgres.network: {}
